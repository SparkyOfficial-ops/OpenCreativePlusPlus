name: OpenCreative++
version: 1.0.0
main: com.opencreativeplus.plugin.OpenCreativePlusPlugin
api-version: 1.20
authors: [Sparky (_ProSto4eloVek_)]
description: Visual scripting engine for Minecraft plots

commands:
  build:
    description: Switch to BUILD mode
    usage: /build
  dev:
    description: Switch to DEV mode
    usage: /dev
  play:
    description: Switch to PLAY mode
    usage: /play
  plot:
    description: Plot management
    usage: /plot <create|trust|untrust> [player]
  ocptps:
    description: Show current TPS
    usage: /ocptps
  ocplogs:
    description: View execution logs for your plot
    usage: /ocplogs
